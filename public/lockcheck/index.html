<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AXM Lockcheck | ¿Tu proyecto instaló un paquete comprometido?</title>
  <meta name="description" content="Arrastra tu package-lock.json, yarn.lock, pnpm-lock.yaml o requirements.txt y descubre al momento si contiene malware conocido, vulnerabilidades, versiones recién publicadas o nombres falsificados. Gratis, sin registro, en tu navegador. Free lockfile scanner by AXM.">
  <meta property="og:title" content="AXM Lockcheck: ¿tu proyecto instaló un paquete comprometido?">
  <meta property="og:description" content="Escáner gratuito de dependencias contra malware y vulnerabilidades, en tu navegador. Free, private lockfile scanner.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Cpath d='M12.5 48 30 16h4l17.5 32h-7.3L32 25.8 19.8 48z' fill='%23f06a5a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../scan/styles.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="../" aria-label="AXM">
      <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12.5 48 30 16h4l17.5 32h-7.3L32 25.8 19.8 48z"/></svg>
      AXM <span class="prod">Lockcheck</span>
    </a>
    <div class="top-r">
      <span class="free" data-i="free"></span>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <main>
    <section class="ask">
      <h1 data-i="h1"></h1>
      <p class="hint lede" data-i="lede"></p>

      <label class="drop" id="drop" for="file">
        <input type="file" id="file" accept=".json,.lock,.yaml,.yml,.txt" hidden>
        <span class="drop-big" data-i="drop"></span>
        <span class="drop-small" data-i="dropSmall"></span>
      </label>
      <div class="alt">
        <button type="button" class="btn" id="paste-toggle" data-i="paste"></button>
        <button type="button" class="btn" id="sample" data-i="sample"></button>
      </div>
      <div class="paste" id="paste-box" hidden>
        <textarea id="paste" spellcheck="false" rows="8"></textarea>
        <button type="button" class="go" id="paste-go" data-i="scan"></button>
      </div>
      <p class="hint" id="hint" data-i="privacy"></p>
    </section>

    <section class="report" id="report" hidden>
      <div class="summary">
        <div class="grade" id="grade"><span id="grade-l">…</span></div>
        <div class="sum-text">
          <p class="sum-dom" id="sum-file"></p>
          <h2 class="sum-h" id="sum-h"></h2>
          <p class="sum-p" id="sum-p"></p>
          <div class="progress" aria-hidden="true"><span id="bar"></span></div>
          <div class="actions">
            <button type="button" class="btn" id="md" data-i="md"></button>
            <button type="button" class="btn" id="json" data-i="json"></button>
            <button type="button" class="btn" id="again" data-i="again"></button>
          </div>
        </div>
      </div>
      <div class="sections" id="sections"></div>
    </section>

    <section class="about">
      <div>
        <h2 data-i="whyH"></h2>
        <p data-i-html="whyP"></p>
        <h2 data-i="whatH"></h2>
        <ul class="checks-list" data-i-html="whatList"></ul>
      </div>
      <div>
        <h2 data-i="privH"></h2>
        <p data-i-html="privP"></p>
        <h2 data-i="ciH"></h2>
        <p data-i-html="ciP"></p>
        <h2 data-i="helpH"></h2>
        <p data-i-html="helpP"></p>
      </div>
    </section>
  </main>

  <footer class="foot"><p data-i-html="foot"></p></footer>

  <script src="i18n.js"></script>
  <script src="parse.js"></script>
  <script src="checks.js"></script>
  <script src="app.js"></script>
</body>
</html>
